name: Process Package Release Announcement

on:
  repository_dispatch:
    types: [addon-release-published]
  workflow_dispatch:
    inputs:
      repository:
        description: 'Addon repository (owner/repo)'
        required: true
        type: string
      tag:
        description: 'Git tag to publish (e.g., v1.0.0)'
        required: true
        type: string

concurrency:
  group: process-addon-release
  cancel-in-progress: false

jobs:
  update-registry:
    name: Validate and Process Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout the registry repository
        uses: actions/checkout@v7

      - name: Set up Python and Dependencies
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: pip install -r requirements-dev.txt

      - name: Get release info from payload
        id: payload
        run: |
          # Support both repository_dispatch (client_payload) and workflow_dispatch (inputs)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "repo_name=${{ github.event.inputs.repository }}" >> $GITHUB_OUTPUT
            echo "new_tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "repo_name=${{ github.event.client_payload.repository }}" >> $GITHUB_OUTPUT
            echo "new_tag=${{ github.event.client_payload.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: "Authorize source and determine commit mode"
        id: auth
        run: |
          # If the repo is not allowed, it will exit 1 and fail the entire job here.
          # If it succeeds, its output (the mode) is captured.
          echo "commit_mode=$(python ./scripts/get_commit_mode.py '${{ steps.payload.outputs.repo_name }}')" >> $GITHUB_OUTPUT

      - name: Download Package Metadata File
        id: download_meta
        run: |
          # Use curl to fetch the raw metadata file. This is the reliable,
          # GitHub-supported method for downloading a single file.
          REMOTE_REPO="${{ steps.payload.outputs.repo_name }}"
          REMOTE_TAG="${{ steps.payload.outputs.new_tag }}"
          METADATA_PATH="rayforge-addon.yaml"
          
          METADATA_URL="https://raw.githubusercontent.com/$REMOTE_REPO/$REMOTE_TAG/$METADATA_PATH"
          
          echo "Downloading metadata from: $METADATA_URL"
          
          # Use curl with flags:
          # -f: Fail fast with an error if the server returns an HTTP error (like 404).
          # -L: Follow redirects.
          # -o: Specify the output filename.
          curl -f -L -o rayforge-addon.yaml "$METADATA_URL"
          
          # Set the path of the created file as an output for later steps.
          echo "metadata_path=rayforge-addon.yaml" >> $GITHUB_OUTPUT

      - name: "Perform comprehensive addon validation"
        run: |
          python ./scripts/validate_addon.py \
            . \
            --tag '${{ steps.payload.outputs.new_tag }}'

      - name: "Verify screenshots are fetchable"
        run: |
          python ./scripts/verify_screenshots.py \
            ${{ steps.download_meta.outputs.metadata_path }} \
            --repo '${{ steps.payload.outputs.repo_name }}' \
            --tag '${{ steps.payload.outputs.new_tag }}'

      - name: Update registry.yaml file
        run: |
          python ./scripts/update_registry.py \
            ${{ steps.download_meta.outputs.metadata_path }} \
            --repo '${{ steps.payload.outputs.repo_name }}' \
            --tag '${{ steps.payload.outputs.new_tag }}'

      - name: "Deploy: Commit and Push Directly"
        if: steps.auth.outputs.commit_mode == 'direct'
        run: |
          git config --global user.name "Rayforge Registry Bot"
          git config --global user.email "noreply@barebaric.com"
          git add registry.yaml
          git commit -m "bot: Publish ${{ steps.payload.outputs.repo_name }}@${{ steps.payload.outputs.new_tag }}"
          git pull --rebase origin main
          git push

      - name: "Deploy: Create Pull Request"
        id: cpr
        if: steps.auth.outputs.commit_mode == 'pr'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: Add ${{ steps.payload.outputs.repo_name }}@${{ steps.payload.outputs.new_tag }}"
          branch: "bot/update-${{ steps.payload.outputs.repo_name }}-${{ steps.payload.outputs.new_tag }}"
          title: "Registry update for ${{ steps.payload.outputs.repo_name }}@${{ steps.payload.outputs.new_tag }}"
          body: |
            Automated PR for community addon update. All automated validations have passed.
            This PR is merged automatically once CI validation passes.
          labels: automated

      - name: Validate registry changes
        id: validate
        if: ${{ !cancelled() && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated') }}
        run: |
          git fetch origin main
          git show origin/main:registry.yaml > "$RUNNER_TEMP/base-registry.yaml"
          python scripts/validate_registry.py \
            --base-file "$RUNNER_TEMP/base-registry.yaml"

      - name: Auto-merge validated pull request
        id: merge
        if: ${{ !cancelled() && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          STATE=$(gh pr view "$PR_URL" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "Pull request is $STATE; nothing to merge."
            exit 0
          fi
          LABELS=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')
          if ! echo "$LABELS" | grep -qx automated; then
            echo "Pull request is not labeled 'automated'; leaving it open."
            exit 0
          fi
          if gh pr merge "$PR_URL" --merge --delete-branch; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_URL" --body "Auto-merge failed, likely due to a merge conflict with main. Re-run the release workflow or merge manually."
          fi

      - name: Notify new pull request
        if: ${{ always() && steps.cpr.outputs.pull-request-operation == 'created' }}
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_TITLE: "Registry update for ${{ steps.payload.outputs.repo_name }}@${{ steps.payload.outputs.new_tag }}"
          DETAILS: "- ${{ steps.payload.outputs.repo_name }}@${{ steps.payload.outputs.new_tag }}"
        run: |
          if [ "${{ steps.validate.outcome }}" = "failure" ]; then
            STATUS="⚠️ Validation failed - manual review required"
          elif [ "${{ steps.validate.outcome }}" = "cancelled" ]; then
            STATUS="⚠️ Workflow cancelled - PR left open"
          elif [ "${{ steps.merge.outputs.merged }}" = "true" ]; then
            STATUS="✅ CI passed - merged automatically"
          else
            STATUS="⚠️ Not merged automatically - check the PR"
          fi
          python scripts/notify_webhook.py \
            --title "$PR_TITLE" \
            --url "$PR_URL" \
            --status "$STATUS" \
            --details "$DETAILS"
