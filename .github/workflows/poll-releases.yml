name: Poll Addon Releases

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: poll-addon-releases
  cancel-in-progress: false

jobs:
  poll:
    name: Discover and Publish New Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the registry repository
        uses: actions/checkout@v7

      - name: Set up Python and Dependencies
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies
        run: pip install -r requirements-dev.txt

      - name: Poll allowlisted repositories for new tags
        id: poll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/poll_releases.py \
            --result-file "$RUNNER_TEMP/poll-result.json"

      - name: Determine commit mode
        id: mode
        if: ${{ !cancelled() }}
        env:
          RESULT_FILE: ${{ runner.temp }}/poll-result.json
        run: |
          echo "pr_mode=false" >> "$GITHUB_OUTPUT"
          echo "pr_body=Automated PR: the scheduled release poll found no pending updates." >> "$GITHUB_OUTPUT"
          if [ ! -f "$RESULT_FILE" ]; then
            exit 0
          fi
          if [ "$(jq '[.updates[] | select(.mode == "pr")] | length' "$RESULT_FILE")" -gt 0 ]; then
            echo "pr_mode=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "pr_body<<POLL_BODY_EOF"
            echo "Automated PR: the scheduled release poll found new addon"
            echo "releases. All automated validations have passed."
            echo ""
            echo "## Pending releases"
            jq -r '.updates[] | "- \(.repo)@\(.tag)"' "$RESULT_FILE"
            echo ""
            echo "This PR is merged automatically once CI validation"
            echo "passes."
            echo "POLL_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "Deploy: Commit and Push Directly"
        if: ${{ !cancelled() && steps.mode.outputs.pr_mode == 'false' }}
        run: |
          if git diff --quiet registry.yaml; then
            echo "Nothing to publish."
            exit 0
          fi
          SUBJECT=$(jq -r 'if (.updates | length) == 1 then "bot: Publish \(.updates[0].repo)@\(.updates[0].tag)" else "bot: Publish \(.updates | length) addon releases" end' "$RUNNER_TEMP/poll-result.json")
          BODY=$(jq -r '.updates | map("- \(.repo)@\(.tag)") | join("\n")' "$RUNNER_TEMP/poll-result.json")
          git config --global user.name "Rayforge Registry Bot"
          git config --global user.email "noreply@barebaric.com"
          git add registry.yaml
          git commit -m "$SUBJECT" -m "$BODY"
          git pull --rebase origin main
          git push

      - name: "Deploy: Create Pull Request"
        id: cpr
        if: ${{ !cancelled() && steps.mode.outputs.pr_mode == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: Add pending addon releases from release poll"
          branch: "bot/poll-releases"
          title: "New addon releases found by release poll"
          body: ${{ steps.mode.outputs.pr_body }}
          labels: automated

      - name: Validate registry changes
        id: validate
        if: ${{ !cancelled() && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated') }}
        run: |
          git fetch origin main
          git show origin/main:registry.yaml > "$RUNNER_TEMP/base-registry.yaml"
          python scripts/validate_registry.py \
            --base-file "$RUNNER_TEMP/base-registry.yaml"

      - name: Auto-merge validated pull request
        id: merge
        if: ${{ !cancelled() && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          STATE=$(gh pr view "$PR_URL" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "Pull request is $STATE; nothing to merge."
            exit 0
          fi
          LABELS=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')
          if ! echo "$LABELS" | grep -qx automated; then
            echo "Pull request is not labeled 'automated'; leaving it open."
            exit 0
          fi
          if gh pr merge "$PR_URL" --merge --delete-branch; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR_URL" --body "Auto-merge failed, likely due to a merge conflict with main. The next release poll will refresh this branch and retry; you can also merge manually."
          fi

      - name: Notify new pull request
        if: ${{ always() && steps.cpr.outputs.pull-request-operation == 'created' }}
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          RESULT_FILE: ${{ runner.temp }}/poll-result.json
        run: |
          if [ "${{ steps.validate.outcome }}" = "failure" ]; then
            STATUS="⚠️ Validation failed - manual review required"
          elif [ "${{ steps.validate.outcome }}" = "cancelled" ]; then
            STATUS="⚠️ Workflow cancelled - PR left open"
          elif [ "${{ steps.merge.outputs.merged }}" = "true" ]; then
            STATUS="✅ CI passed - merged automatically"
          else
            STATUS="⚠️ Not merged automatically - check the PR"
          fi
          DETAILS=""
          if [ -f "$RESULT_FILE" ]; then
            DETAILS=$(jq -r '.updates | map("- \(.repo)@\(.tag)") | join("\n")' "$RESULT_FILE")
          fi
          python scripts/notify_webhook.py \
            --title "New addon releases found by release poll" \
            --url "$PR_URL" \
            --status "$STATUS" \
            --details "$DETAILS"
